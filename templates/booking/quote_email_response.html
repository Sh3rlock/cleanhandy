{% extends "base.html" %}
{% block content %}
  <div class="wrap section">
    <h1>{% if action == "accepted" %}Quote accepted{% elif action == "declined" %}Quote declined{% else %}Quote{% endif %}</h1>
    <p>{{ message }}</p>
    {% if quote %}
      <p>{{ quote.service.name }} · Quote #{{ quote.pk }}</p>
    {% endif %}
    <p><a class="button" href="{% url 'home' %}">Back to TheCleanHandy</a></p>
  </div>
{% endblock %}
