<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ company.legal_name }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,sans-serif;color:#333333;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f4;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:10px;">
          <tr>
            <td style="background:#F15A29;padding:28px;text-align:center;">
              <h1 style="margin:0;color:#ffffff;font-size:24px;">{{ company.legal_name }}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;font-size:16px;line-height:1.5;">
              {% for paragraph in paragraphs %}
                <p style="margin:0 0 16px;">{{ paragraph }}</p>
              {% endfor %}
              <p style="margin:24px 0 0;font-size:14px;color:#666666;">
                <a href="{{ unsubscribe_url }}" style="color:#F15A29;">Unsubscribe</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
